name: Sync YouTube videos to the site
on:
  schedule:
    - cron: "17 * * * *"   # every 4 hours
  workflow_dispatch: {}
  push:                     # rebuild the site automatically after every change to the builder
    branches: [main]
    paths: ["_builder/**"]
permissions:
  contents: write
concurrency: { group: site-sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install chess==1.11.1 pillow==11.0.0
      - name: Sync, build and push (retry when someone pushed in between)
        run: |
          git config user.name "ThroiyChess bot"
          git config user.email "throiychess@users.noreply.github.com"
          for i in 1 2 3; do
            python _builder/sync_youtube.py
            OUT_DIR=. python _builder/build.py
            git add -A
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -m "Auto: new YouTube videos"
            if git push; then exit 0; fi
            echo "push rejected (attempt $i), starting again from the latest main"
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1
