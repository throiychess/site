name: Sync YouTube videos to the site
on:
  schedule:
    - cron: "17 * * * *"   # every 4 hours
  workflow_dispatch: {}
  push:                     # rebuild the site automatically after every change to the builder
    branches: [main]
    paths: ["_builder/**"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install chess==1.11.1 pillow==11.0.0
      - run: python _builder/sync_youtube.py
      - run: OUT_DIR=. python _builder/build.py
      - run: |
          git config user.name "ThroiyChess bot"
          git config user.email "throiychess@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Auto: new YouTube videos" && git push)
